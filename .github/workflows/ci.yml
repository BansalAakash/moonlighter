name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite shells out to bash and, where present, zsh (tests skip cleanly without it).
      # Installing zsh on Linux makes the zsh trap test run there too instead of skipping.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm test

  menubar:
    name: Menu bar app (build, self-test, package)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The app has no XCTest target; --self-test is its test suite (shell timeouts, countdown
      # text, snapshot contract, tmux pane-list parsing without a locale).
      - name: Build and self-test
        working-directory: menubar
        run: |
          swift build -c release
          .build/release/Moonlighter --self-test
      # The real thing: the .app with its own Node, then started the way a user's Mac would meet it
      # (against a throwaway $HOME; launchd is skipped).
      - name: Package and verify the app
        run: |
          ./packaging/build_mac_app.sh
          ./packaging/verify_build.sh

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the installers and helper scripts
        run: |
          bash -n install.sh
          for f in packaging/*.sh launchd/watchdog.sh; do bash -n "$f"; done
          sh -n bin/tmux-status.sh
